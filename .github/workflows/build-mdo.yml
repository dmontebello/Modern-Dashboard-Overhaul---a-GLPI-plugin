name: Build and validate MDO Dev candidate
on:
  push:
    branches: [Dev, Main]
    # Do not start CI for documentation-only commits.
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [Main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check code and candidate documentation
        run: |
          bash tools/verifica-sintassi.sh --local
          php tests/unit_php.php
          php tests/tasks_php.php
          php tests/standalone_php.php
          php tests/task_activity_php.php
          python3 -B tests/packaging_test.py
          python3 -B tools/maintainer/check_dev_docs.py
      - name: Install browser dependencies
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
      - name: Responsive UI (NON COLLAUDATO LIVE)
        run: |
          python3 tests/ui_playwright.py
          python3 tests/tasks_ui_playwright.py
          python3 tests/settings_ui_playwright.py
          python3 tests/standalone_ui_playwright.py
      - name: Build exact tested source
        run: |
          mdo_version="$(python3 -c 'import sys; sys.path.insert(0,"tools/maintainer"); from versioning import version; from pathlib import Path; print(version(Path(".")))')"
          python3 -B tools/maintainer/package_from_repo.py --output "build/candidate/Modern_Dashboard_Overhaul_${mdo_version}.zip"
          python3 -B tools/maintainer/publish_dev.py "build/candidate/Modern_Dashboard_Overhaul_$(python3 -c 'import sys; sys.path.insert(0,"tools/maintainer"); from versioning import version; from pathlib import Path; print(version(Path(".")))').zip" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --verify-only
      - uses: actions/upload-artifact@v4
        with:
          name: MDO-Dev-candidate
          path: |
            build/candidate/Modern_Dashboard_Overhaul_0.8.1-dev.*.zip
            build/candidate/Modern_Dashboard_Overhaul_0.8.1-dev.*.zip.sha512
          if-no-files-found: error
  publish_dev_zip:
    needs: bundle
    if: github.ref == 'refs/heads/Dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mdo-dev-zip-publish
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: MDO-Dev-candidate
          path: build/verified
      - name: Publish only the current tested Dev source
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -B tools/maintainer/publish_dev.py "build/verified/Modern_Dashboard_Overhaul_$(python3 -c 'import sys; sys.path.insert(0,"tools/maintainer"); from versioning import version; from pathlib import Path; print(version(Path(".")))').zip" --source-sha "$TESTED_SHA" --run-id "$GITHUB_RUN_ID"
