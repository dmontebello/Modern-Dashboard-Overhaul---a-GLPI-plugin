name: Build and validate MDO plugin ZIP
on:
  push:
    branches:
      - Dev
      - Main
  pull_request:
    branches:
      - Main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check PHP and JavaScript
        run: |
          bash tools/verifica-sintassi.sh --local
          php tests/unit_php.php
          php tests/tasks_php.php
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
      - name: Responsive UI (isolated GLPI doubles)
        run: |
          python3 tests/ui_playwright.py
          python3 tests/tasks_ui_playwright.py
      - name: Build full GLPI ZIP
        run: |
          python3 -B tools/maintainer/package_from_repo.py
          sha512sum -c Modern_Dashboard_Overhaul_0.8.0_Pilot.zip.sha512
          unzip -t Modern_Dashboard_Overhaul_0.8.0_Pilot.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MDO-0.8.0-Pilot
          path: |
            Modern_Dashboard_Overhaul_0.8.0_Pilot.zip
            Modern_Dashboard_Overhaul_0.8.0_Pilot.zip.sha512
          if-no-files-found: error
